name: "task64"
arch: "<arch>"
platform: "linux"
version: "<version>"
description: "Task64 is an open-source todo application, written in Go. It lets you create lists,tasks and share them via teams or directly between users."
maintainer: "Task64 Maintainers <maintainers@vikunja.io>"
homepage: "https://vikunja.io"
section: "default"
priority: "extra"
license: "AGPLv3"
depends:
  - systemd
rpm:
  signature:
    key_file: ${NFPM_GPG_KEY_FILE}
# apk and archlinux run `scripts.postinstall` on a fresh install only — nfpm
# maps their upgrade hooks from these packager-specific keys instead. Without
# them, upgrading on Alpine or Arch runs no maintainer script at all.
apk:
  scripts:
    postupgrade: ./build/after-install-openrc.sh
archlinux:
  scripts:
    postupgrade: ./build/after-install.sh
overrides:
  apk:
    depends:
      - openrc
    scripts:
      postinstall: ./build/after-install-openrc.sh
contents:
  - src: <binlocation>
    dst: /opt/task64/task64
  - src: ./config.yml.sample
    dst: /etc/task64/config.yml
    # noreplace only affects rpm; the other packagers treat it as plain config.
    type: "config|noreplace"
  - src: /opt/task64/task64
    dst: /usr/local/bin/task64
    type: "symlink"
  - src: task64.service
    dst: /usr/lib/systemd/system/task64.service
  - src: task64.initd
    dst: /etc/init.d/task64
    type: "config"
    packager: apk
scripts:
  postinstall: ./build/after-install.sh
